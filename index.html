<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Explorer Task</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <nav><h1>Task Manager Application</h1>
      <button id="Dark&light-mode">Dark mode</button>
    </nav>
    <main>
        <form class="add-task-card">
            <h1>Add New Task</h1>
            <input required type="text" id="taskInput" placeholder="Enter your task">
            <select required  id="category">
                <option value="">Select category</option>
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="shopping">Study</option>
                <option value="others">Others</option>
            </select>
            <button id="addTask">Add Task</button>
        </form>

             <section  class="task-lists">
                <h1 class="task-list-title">Your Task List</h1>
   
             </section>


             <section class="editbutton-section">
                
             </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
