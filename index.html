<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Explorer Task</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <nav><h1>Task Manager Application</h1>
      <button id="Dark&light-mode">Dark mode</button>
    </nav>
    <main>
        <form class="add-task-card">
            <h1>Add New Task</h1>
            <input required type="text" id="taskInput" placeholder="Enter your task">
            <select required  id="category">
                <option value="">Select category</option>
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="shopping">Study</option>
                <option value="others">Others</option>
            </select>
            <button id="addTask">Add Task</button>
        </form>
          

       <section class="search-section">
        
    </section>





             <section  class="task-lists">
                <h1 class="task-list-title">Your Task List</h1>
   
             </section>


             <section class="editbutton-section">
                
             </section>

      


             <section class="section5">
                <h1>Event Propagation Demo</h1>
                <h4>Open browser console and click the button below to see Event Bubbling and Capturing order.</h4>
               <div class="section-5">Grandparent
                 <div class="section-5-div">Parent
                    <button class="section-5-btn">Child</button>
                </div>
               </div>
             </section>


             <section class="rendering">
                <div class="pipeline">HTML</div>
                <div class="arrow">↓</div>
                <div class="pipeline">Parsing</div>
                <div class="arrow">↓</div>
                <div class="pipeline">Tokenization</div>
                <div class="arrow">↓</div>
                <div class="pipeline">DOM Tree</div>
                <div class="arrow">↓</div>
                <div class="pipeline">CSS</div>
                <div class="arrow">↓</div>
                <div class="pipeline">CSSOM Tree</div>
                <div class="arrow">↓</div>
                <div class="pipeline">DOM Tree + CSSOM Tree</div>
                <div class="arrow">↓</div>
                <div class="pipeline">Render Tree</div>
             </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
